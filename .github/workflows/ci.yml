name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Least privilege: no job here writes to the repository. Without this block the token
# inherits repository or organisation defaults, which build scripts and tests can read.
permissions:
  contents: read

jobs:
  # The Rust engine is the default analysis path — anti-patterns, import graphs
  # and proxy rules all run through it when the embedded binary resolves. It had
  # no CI at all: nothing ran cargo fmt, clippy or its tests, so a regression
  # there was invisible until it reached a user.
  engine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # checkout persists the token in .git/config by default; nothing here pushes.
          persist-credentials: false
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
          rustup default 1.97.1
      - name: Format
        working-directory: engine
        run: cargo fmt --check
      - name: Clippy
        working-directory: engine
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        working-directory: engine
        run: cargo test

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # checkout persists the token in .git/config by default; nothing here pushes.
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.x'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools protobuf-compiler
      - name: Build engine
        working-directory: engine
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Place engine binary for embed
        run: |
          mkdir -p internal/engineclient/bin
          cp engine/target/x86_64-unknown-linux-musl/release/verikt-engine internal/engineclient/bin/verikt-engine-linux-amd64
          chmod +x internal/engineclient/bin/verikt-engine-linux-amd64
      - name: Test
        run: go test $(go list ./... | grep -v '/experiments/\|/engineclient/experiment$')
      - name: Vet
        run: go vet $(go list ./... | grep -v '/experiments/\|/engineclient/experiment$')
      - name: Build
        run: go build $(go list ./... | grep -v '/experiments/\|/engineclient/experiment$')

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # checkout persists the token in .git/config by default; nothing here pushes.
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.x'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools protobuf-compiler
      - name: Build engine
        working-directory: engine
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Place engine binary for embed
        run: |
          mkdir -p internal/engineclient/bin
          cp engine/target/x86_64-unknown-linux-musl/release/verikt-engine internal/engineclient/bin/verikt-engine-linux-amd64
          chmod +x internal/engineclient/bin/verikt-engine-linux-amd64
      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: v2.11.3

  # verikt checks itself. Every architecture bug found in this repository so far
  # was found by hand; the root verikt.yaml makes that automatic.
  #
  # Gates on error severity only, which is what `verikt check` exits non-zero for.
  # The warning-level findings it reports are real debt and are deliberately not
  # silenced — see the self-governance commit.
  self-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # checkout persists the token in .git/config by default; nothing here pushes.
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.x'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools protobuf-compiler
      # The engine is the default analysis path, so verikt must check itself with
      # it present — the Go fallback exercises different code.
      - name: Build engine
        working-directory: engine
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Place engine binary for embed
        run: |
          mkdir -p internal/engineclient/bin
          cp engine/target/x86_64-unknown-linux-musl/release/verikt-engine internal/engineclient/bin/verikt-engine-linux-amd64
          chmod +x internal/engineclient/bin/verikt-engine-linux-amd64
      - name: Build verikt
        run: go build -o /tmp/verikt ./cmd/verikt
      - name: Check architecture
        run: /tmp/verikt check
      # Warning-level findings are real debt that does not fail the build. Without
      # a ceiling they accumulate unnoticed, so the count is ratcheted: it may fall
      # freely, and rising above the baseline fails the job.
      - name: Ratchet warning-level debt
        run: |
          /tmp/verikt check --output json > verikt-check.json
          baseline=$(grep -vE '^\s*#|^\s*$' .github/verikt-debt-baseline | head -1)
          current=$(jq '[.violations[], .anti_patterns[]] | map(select(.severity != "error")) | length' verikt-check.json)

          jq -r '
            [.violations[], .anti_patterns[]]
            | group_by(.severity)
            | map("  \(length)\t\(.[0].severity)")
            | .[]
          ' verikt-check.json

          echo "non-error findings: $current (baseline $baseline)"
          if [ "$current" -gt "$baseline" ]; then
            echo "::error::Warning-level findings rose from $baseline to $current."
            echo "Fix the new findings, or raise .github/verikt-debt-baseline deliberately with a reason."
            exit 1
          fi
          if [ "$current" -lt "$baseline" ]; then
            echo "::notice::Debt fell to $current. Lower .github/verikt-debt-baseline to lock the gain in."
          fi

  template-matrix:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go-version: ['1.22.x', '1.23.x', '1.24.x', '1.25.x', '1.26.x']
      fail-fast: false
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # checkout persists the token in .git/config by default; nothing here pushes.
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.x'
      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get install -y musl-tools protobuf-compiler
      - name: Build engine
        working-directory: engine
        run: cargo build --release --target x86_64-unknown-linux-musl
      - name: Place engine binary for embed
        run: |
          mkdir -p internal/engineclient/bin
          cp engine/target/x86_64-unknown-linux-musl/release/verikt-engine internal/engineclient/bin/verikt-engine-linux-amd64
          chmod +x internal/engineclient/bin/verikt-engine-linux-amd64
      - name: Build verikt
        run: go build $(go list ./... | grep -v '/experiments/\|/engineclient/experiment$')
      - name: Run template compilation tests
        env:
          VERIKT_TEST_GO_VERSION: ${{ matrix.go-version }}
        run: go test ./internal/scaffold/ -run TestTemplateCompilation -count=1 -v
