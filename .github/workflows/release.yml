name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  # Re-pushing a tag re-fires this workflow, and GoReleaser only discovers the
  # problem after the four-way engine matrix has run: it rebuilds everything,
  # then dies uploading assets that already exist. Six minutes to reach a 422.
  #
  # The failure is loud, so it is not the dangerous case. The dangerous case is
  # the same run succeeding: if a release's assets had been deleted, re-pushing
  # an *older* tag would upload cleanly and then push that tag's Formula over
  # the tap, downgrading every "brew install verikt" to a previous version with
  # nothing anywhere reporting a downgrade had happened.
  #
  # Both are decided here, before anything is built.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    outputs:
      already-released: ${{ steps.check.outputs.already-released }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # The newest-tag comparison needs every tag, not just this one.
          fetch-depth: 0
          persist-credentials: false

      - id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # An already-published tag is a no-op, not a failure. Checked first, so
          # that re-pushing any tag — including an old one — skips quietly rather
          # than tripping the downgrade guard below.
          assets=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets -q '.assets|length' 2>/dev/null || echo none)
          if [ "$assets" != "none" ] && [ "$assets" != "0" ]; then
            echo "::notice::$TAG is already published with $assets assets. Skipping the release."
            echo "already-released=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          newest=$(git tag --list 'v*' | sort -V | tail -1)
          if [ "$TAG" != "$newest" ]; then
            echo "::error::$TAG is older than $newest. Publishing it would overwrite the Homebrew formula with $TAG and downgrade every install."
            exit 1
          fi

          echo "already-released=false" >> "$GITHUB_OUTPUT"

  build-engine:
    name: Build engine (${{ matrix.artifact }})
    needs: preflight
    if: needs.preflight.outputs.already-released != 'true'
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: verikt-engine-linux-amd64
            use_cross: false
            apt_packages: musl-tools protobuf-compiler
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
            artifact: verikt-engine-linux-arm64
            use_cross: true
            apt_packages: protobuf-compiler
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: verikt-engine-darwin-amd64
            use_cross: false
            apt_packages: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: verikt-engine-darwin-arm64
            use_cross: false
            apt_packages: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Install apt packages
        if: matrix.apt_packages != '' && runner.os == 'Linux'
        run: sudo apt-get install -y ${{ matrix.apt_packages }}

      - name: Install protoc (macOS)
        if: runner.os == 'macOS'
        run: brew install protobuf

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          rustup target add ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross --locked

      - name: Build engine (cross)
        if: matrix.use_cross
        working-directory: engine
        run: cross build --release --target ${{ matrix.target }}

      - name: Build engine (native)
        if: "!matrix.use_cross"
        working-directory: engine
        run: cargo build --release --target ${{ matrix.target }}

      - name: Upload engine binary
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ matrix.artifact }}
          path: engine/target/${{ matrix.target }}/release/verikt-engine
          retention-days: 1

  goreleaser:
    name: GoReleaser
    needs: build-engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          # goreleaser reads tags; it does not push with the checkout credential.
          persist-credentials: false

      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version: '1.26.x'

      - name: Download engine binaries
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: engine-artifacts

      - name: Place engine binaries for embed
        run: |
          mkdir -p internal/engineclient/bin
          cp engine-artifacts/verikt-engine-linux-amd64/verikt-engine  internal/engineclient/bin/verikt-engine-linux-amd64
          cp engine-artifacts/verikt-engine-linux-arm64/verikt-engine  internal/engineclient/bin/verikt-engine-linux-arm64
          cp engine-artifacts/verikt-engine-darwin-amd64/verikt-engine internal/engineclient/bin/verikt-engine-darwin-amd64
          cp engine-artifacts/verikt-engine-darwin-arm64/verikt-engine internal/engineclient/bin/verikt-engine-darwin-arm64
          # Only the engine binaries. `bin/*` also matched README.md — which is
          # committed so `//go:embed bin` always has something to match — and
          # flipping its mode to 755 left the tree dirty, which GoReleaser
          # refuses to release from. The release failed before building anything.
          chmod +x internal/engineclient/bin/verikt-engine-*

      # A release that ships without a real engine degrades silently to Go-native
      # analysis: findings change, severities change, and nothing reports why. Once
      # the embed tolerates a missing binary, an empty or truncated file would build
      # cleanly and reach users. Fail the release instead.
      - name: Verify every engine binary is real
        run: |
          set -euo pipefail
          missing=0
          for target in linux-amd64 linux-arm64 darwin-amd64 darwin-arm64; do
            path="internal/engineclient/bin/verikt-engine-$target"
            if [ ! -f "$path" ]; then
              echo "::error::$path is missing — the engine was not placed for embed"
              missing=1
              continue
            fi
            size=$(wc -c < "$path")
            if [ "$size" -lt 1000000 ]; then
              echo "::error::$path is $size bytes — too small to be an engine build (placeholder or truncated artefact)"
              missing=1
              continue
            fi
            echo "  ok  $target  ${size} bytes"
          done
          [ "$missing" -eq 0 ]

      # GoReleaser refuses to release from a dirty tree, and it discovers that
      # after the four-way engine matrix has already run. Checking here names the
      # offending file immediately and costs nothing.
      - name: Verify the working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Placing the engine binaries modified tracked files; GoReleaser will refuse to release."
            git status --porcelain
            git diff --summary
            exit 1
          fi

      - uses: goreleaser/goreleaser-action@ec59f474b9834571250b370d4735c50f8e2d1e29 # v7.0.0
        with:
          # Pinned, not "~> v2": a floating major picks up a release that can
          # deprecate config — the brews block among it — during a tag, which is
          # the worst moment to discover it. 2.17.1 built 0.2.0 and 0.2.1.
          version: 2.17.1
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
