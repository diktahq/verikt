# Toolchains required to build verikt end to end. Run `mise install`.
#
# Versions match .github/workflows/ci.yml — if you change one, change both, or
# contributors will hit failures CI cannot reproduce.
#
#   go             — the CLI, orchestrator and all analysis fallbacks
#   rust           — the embedded engine under engine/ (needs >= 1.85 for edition 2024)
#   bun            — the docs site under website/
#   golangci-lint  — pinned to the version the lint job installs. Linters gain checks
#                    between releases, so an older local binary reports a clean run on
#                    code CI rejects.
#   lefthook       — the git hooks in lefthook.yml. Install them once per clone with
#                    `mise exec -- lefthook install`.
#   shellcheck     — lints scripts/*.sh in `mise run verify`.
#
# rust and bun are exact, and every workflow pins the same value. Floating selectors
# ("stable", "latest") meant a green local run said nothing about CI, and a toolchain
# release could break a build nobody had touched — which is exactly how a clippy lint
# and a golangci-lint check both slipped past local runs.
#
# go floats on the patch version deliberately: Go patch releases are backward-compatible
# security fixes, and pinning one would strand the build on a known-vulnerable toolchain.
[tools]
go = "1.26"
rust = "1.97.1"
bun = "1.3.11"
golangci-lint = "2.15.0"
lefthook = "2.2.1"
shellcheck = "0.11.0"

# The engine binary is embedded via //go:embed from internal/engineclient/bin/.
# It is gitignored, so a fresh clone has nothing to embed until you run:
#   mise run build-engine
[tasks.build-engine]
description = "Build the Rust engine and place it for //go:embed"
run = """
set -euo pipefail
cd engine
cargo build --release
cd ..
mkdir -p internal/engineclient/bin
case "$(uname -s)-$(uname -m)" in
  Darwin-arm64) target=verikt-engine-darwin-arm64 ;;
  Darwin-x86_64) target=verikt-engine-darwin-amd64 ;;
  Linux-x86_64) target=verikt-engine-linux-amd64 ;;
  Linux-aarch64) target=verikt-engine-linux-arm64 ;;
  *) echo "unsupported platform: $(uname -s)-$(uname -m)" >&2; exit 1 ;;
esac
cp engine/target/release/verikt-engine "internal/engineclient/bin/$target"
chmod +x "internal/engineclient/bin/$target"
echo "placed internal/engineclient/bin/$target"
"""

[tasks.check-engine]
description = "Run the engine's own gates (matches the CI engine job)"
dir = "engine"
run = ["cargo fmt --check", "cargo clippy --all-targets -- -D warnings", "cargo test"]

# Two gate sets. GitHub Actions does not run for this repository, so nothing else
# checks a change.
#
#   verify         fast gates for development; the lefthook pre-push hook and
#                  `make check` call it.
#   release-check  the full suite before tagging a release: engine gates, a freshly
#                  built engine, the race detector, compiled scaffolds and the debt
#                  baseline.
#
# The self-check lives in release-check because it needs a freshly built engine: a debt
# baseline measured against a stale embedded engine was once 4 findings short, and the
# run still passed, so nothing signalled the gap.
[tasks.verify]
description = "Fast gates for development (pre-push): build, vet, format, tidy, tests, lint, installer"
run = """
set -euo pipefail

echo '── go ──'
go build ./...
go vet ./...
test -z "$(gofmt -l internal cmd providers | grep -v experiment/testdata || true)"
go mod tidy -diff
go test ./...
golangci-lint run

echo '── installer ──'
shellcheck scripts/*.sh
bash scripts/install_test.sh

echo '── fast gates passed (run `mise run release-check` before a release) ──'
"""

# The full suite, run before tagging a release. It rebuilds the engine, runs the
# race detector, compiles 28 freshly scaffolded projects (downloads Go modules,
# so it needs network) and measures verikt against its own debt baseline. Too
# slow for every push; nothing else runs it, so a release must not skip it.
[tasks.release-check]
description = "Full suite before a release: engine gates, fresh engine, race, scaffold builds, self-check"
run = """
set -euo pipefail
: "${TMPDIR:=/tmp}"

echo '── engine ──'
cd engine
cargo fmt --check
cargo clippy --all-targets -- -D warnings
cargo test
cd ..

echo '── embed the engine just built ──'
mise run build-engine

echo '── fast gates ──'
mise run verify

echo '── race detector ──'
go test -race ./...

echo '── generated projects compile ──'
CGO_ENABLED=0 VERIKT_BUILD_SCAFFOLDS=1 go test -count=1 -run TestScaffoldBuilds ./internal/cli

echo '── verikt checks itself (fresh engine) ──'
go build -o "$TMPDIR/verikt-verify" ./cmd/verikt
"$TMPDIR/verikt-verify" check
"$TMPDIR/verikt-verify" check --output json > "$TMPDIR/verikt-verify.json"
baseline=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' .github/verikt-debt-baseline | head -1)
current=$(jq '[.violations[], .anti_patterns[]] | map(select(.severity != "error")) | length' "$TMPDIR/verikt-verify.json")
echo "non-error findings: $current (baseline $baseline)"
[ "$current" -le "$baseline" ]

echo '── corpus audit script ──'
VERIKT="$TMPDIR/verikt-verify" bash scripts/corpus-audit_test.sh

echo '── reminder: ADR-012 ──'
echo 'Run scripts/corpus-audit.sh over real repositories and read its suspected false positives before tagging.'

echo '── release suite passed ──'
"""

